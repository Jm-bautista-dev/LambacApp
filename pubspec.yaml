name: lambac_app
description: "Lambac Coffee Roastery — Production Cross-Platform Mobile Application"
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Routing & Navigation
  go_router: ^14.2.0

  # Networking & HTTP
  dio: ^5.4.3+1

  # Design & Typography
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1

  # Storage & Persistence
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Utilities & Helpers
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0
  crypto: ^3.0.3
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.3.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_app_check: ^0.4.8
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
