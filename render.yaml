services:
  - type: web
    name: lambac-paymongo-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FIREBASE_PROJECT_ID
        value: lambac-coffee-roastery
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PAYMONGO_SECRET_KEY
        sync: false
      - key: PAYMONGO_WEBHOOK_SECRET
        sync: false
      - key: APP_WEB_ORIGIN
        value: https://lambac-coffee-roastery.web.app
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:64076,http://localhost:3000,http://localhost:5000,http://localhost:8080,https://lambac-coffee-roastery.web.app,https://lambac-coffee-roastery.firebaseapp.com
      - key: CORS_ALLOW_LOCALHOST
        value: "true"

